<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andres Castro</title>
    <link href="https://fonts.cdnfonts.com/css/neutra-text" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/andrescastrologosolo.png">
  </head>
  <body>
    <div id="root"></div>

    <!-- Transition overlay: lives outside React, cannot be re-rendered -->
    <div id="page-transition-overlay" style="
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-100%);
      pointer-events: none;
      will-change: transform;
    ">
      <div style="max-width: 56rem; margin: 0 auto; padding: 0 2.5rem;">
        <p id="page-transition-quote" style="
          color: #fff;
          text-align: center;
          font-weight: 300;
          line-height: 1.8;
          font-size: clamp(1.05rem, 2.5vw, 1.875rem);
          opacity: 0;
          letter-spacing: 0.025em;
          font-family: 'Cormorant Garamond', serif;
        "></p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
